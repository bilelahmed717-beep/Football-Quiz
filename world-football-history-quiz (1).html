<style>
  :root{
    --bg: #0e0f12;
    --card-radius: 18px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Inter',sans-serif;
    background: radial-gradient(circle at 20% -10%, #1b1d24 0%, #0a0b0d 55%, #050506 100%);
    color:#f2f2f2;
    min-height:100vh;
    padding:20px 14px 90px;
  }
  header{
    text-align:center;
    margin-bottom:22px;
  }
  header h1{
    font-family:'Poppins',sans-serif;
    font-weight:700;
    font-size:1.6rem;
    letter-spacing:.5px;
    background:linear-gradient(90deg,#ffd76b,#ff8a5c 45%,#7cd6ff);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  header p{
    color:#9a9ba3;
    font-size:.85rem;
    margin-top:6px;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
    gap:12px;
    max-width:720px;
    margin:0 auto;
  }
  .card{
    position:relative;
    border-radius:var(--card-radius);
    padding:16px 14px 14px;
    cursor:pointer;
    overflow:hidden;
    min-height:118px;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    border:1px solid rgba(255,255,255,.08);
    transition:transform .18s ease, box-shadow .18s ease;
    isolation:isolate;
  }
  .card:active{transform:scale(.96);}
  .card::before{
    content:"";
    position:absolute;inset:0;
    background:var(--grad);
    opacity:.92;
    z-index:-1;
  }
  .card .emoji{
    font-size:1.7rem;
    margin-bottom:8px;
    filter:drop-shadow(0 2px 4px rgba(0,0,0,.4));
  }
  .card .title{
    font-weight:700;
    font-size:.95rem;
    line-height:1.2;
    color:#fff;
    text-shadow:0 1px 3px rgba(0,0,0,.35);
  }
  .card .sub{
    font-size:.68rem;
    color:rgba(255,255,255,.85);
    margin-top:3px;
  }
  .card .qcount{
    position:absolute;
    top:10px;right:10px;
    background:rgba(0,0,0,.28);
    color:#fff;
    font-size:.62rem;
    padding:2px 7px;
    border-radius:20px;
    font-weight:600;
  }

  /* ===== Quiz overlay ===== */
  .overlay{
    position:fixed;inset:0;
    background:var(--qbg);
    display:none;
    flex-direction:column;
    z-index:50;
    font-family:var(--qfont);
    color:var(--qtext);
  }
  .overlay.active{display:flex;}
  .qtop{
    display:flex;align-items:center;gap:10px;
    padding:16px 16px 10px;
  }
  .backBtn{
    background:rgba(255,255,255,.12);
    border:none;color:inherit;
    width:34px;height:34px;border-radius:50%;
    font-size:1rem;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .progWrap{
    flex:1;height:8px;border-radius:6px;
    background:rgba(255,255,255,.15);
    overflow:hidden;
  }
  .progBar{
    height:100%;border-radius:6px;
    background:var(--qaccent);
    width:0%;
    transition:width .3s ease;
  }
  .scoreTag{
    font-size:.78rem;font-weight:700;
    background:rgba(255,255,255,.12);
    padding:5px 10px;border-radius:20px;
    white-space:nowrap;
  }
  .qbody{
    flex:1;
    padding:10px 20px 20px;
    display:flex;flex-direction:column;
    max-width:520px;width:100%;margin:0 auto;
    overflow-y:auto;
  }
  .quizTitle{
    font-size:1.15rem;
    font-weight:700;
    margin-bottom:2px;
    color:var(--qaccent);
  }
  .qnum{
    font-size:.75rem;
    color:var(--qtext);
    opacity:.65;
    margin-bottom:14px;
  }
  .question{
    font-size:1.15rem;
    font-weight:600;
    line-height:1.45;
    margin-bottom:20px;
  }
  .options{
    display:flex;flex-direction:column;gap:10px;
  }
  .opt{
    text-align:left;
    padding:13px 16px;
    border-radius:13px;
    border:1.5px solid var(--qborder);
    background:var(--qoptbg);
    color:var(--qtext);
    font-family:inherit;
    font-size:.95rem;
    cursor:pointer;
    transition:all .15s ease;
  }
  .opt:active{transform:scale(.98);}
  .opt.correct{
    background:#1f9d55 !important;
    border-color:#1f9d55 !important;
    color:#fff !important;
  }
  .opt.wrong{
    background:#c93b3b !important;
    border-color:#c93b3b !important;
    color:#fff !important;
  }
  .opt.disabled{pointer-events:none;opacity:.75;}
  .factBox{
    margin-top:18px;
    padding:14px 16px;
    border-radius:13px;
    background:var(--qoptbg);
    border-left:4px solid var(--qaccent);
    font-size:.85rem;
    line-height:1.5;
    display:none;
  }
  .factBox.show{display:block;}
  .nextBtn{
    margin-top:20px;
    padding:14px;
    border:none;border-radius:13px;
    background:var(--qaccent);
    color:#111;
    font-weight:700;
    font-size:.95rem;
    cursor:pointer;
    display:none;
  }
  .nextBtn.show{display:block;}

  /* result screen */
  .resultWrap{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:30px 24px;
    max-width:480px;margin:0 auto;
  }
  .resultWrap .big{font-size:3rem;margin-bottom:6px;}
  .resultWrap h2{font-size:1.4rem;margin-bottom:6px;color:var(--qaccent);}
  .resultWrap p{font-size:.9rem;opacity:.8;margin-bottom:22px;}
  .resultBtns{display:flex;gap:10px;width:100%;}
  .resultBtns button{
    flex:1;padding:13px;border-radius:12px;border:none;font-weight:700;cursor:pointer;font-family:inherit;
  }
  .retryBtn{background:var(--qaccent);color:#111;}
  .homeBtn{background:rgba(255,255,255,.12);color:var(--qtext);}

  .credit{
    position:fixed;
    bottom:8px;right:12px;
    font-size:.62rem;
    color:rgba(255,255,255,.35);
    z-index:5;
    letter-spacing:.3px;
  }
  .credit.inQuiz{color:var(--qtext);opacity:.35;}

  @media (max-width:360px){
    .grid{grid-template-columns:repeat(2,1fr);}
  }
</style>
</head>

let current = null;
let qIndex = 0;
let score = 0;
let answered = false;

const grid = document.getElementById('grid');
QUIZZES.forEach((quiz, i)=>{
  const card = document.createElement('div');
  card.className = 'card';
  card.style.setProperty('--grad', quiz.grad);
  card.innerHTML = `
    <div class="qcount">${quiz.questions.length} Q</div>
    <div class="emoji">${quiz.emoji}</div>
    <div class="title">${quiz.title}</div>
    <div class="sub">${quiz.sub}</div>
  `;
  card.onclick = ()=> startQuiz(i);
  grid.appendChild(card);
});

const overlay = document.getElementById('overlay');
const qbody = document.getElementById('qbody');
const progBar = document.getElementById('progBar');
const scoreTag = document.getElementById('scoreTag');
document.getElementById('backBtn').onclick = closeQuiz;

function applyTheme(t){
  overlay.style.setProperty('--qbg', t.bg);
  overlay.style.setProperty('--qfont', t.font);
  overlay.style.setProperty('--qaccent', t.accent);
  overlay.style.setProperty('--qtext', t.text);
  overlay.style.setProperty('--qborder', t.border);
  overlay.style.setProperty('--qoptbg', t.optbg);
}

function startQuiz(i){
  current = QUIZZES[i];
  qIndex = 0; score = 0;
  applyTheme(current.theme);
  overlay.classList.add('active');
  renderQuestion();
}

function closeQuiz(){
  overlay.classList.remove('active');
  current = null;
}

function renderQuestion(){
  answered = false;
  const total = current.questions.length;
  progBar.style.width = ((qIndex)/total*100)+'%';
  scoreTag.textContent = score+'/'+total;

  if(qIndex >= total){
    renderResult();
    return;
  }
  const item = current.questions[qIndex];
  qbody.innerHTML = `
    <div class="quizTitle">${current.emoji} ${current.title}</div>
    <div class="qnum">Question ${qIndex+1} of ${total}</div>
    <div class="question">${item.q}</div>
    <div class="options" id="optsWrap"></div>
    <div class="factBox" id="factBox"></div>
    <button class="nextBtn" id="nextBtn">Next →</button>
  `;
  const optsWrap = document.getElementById('optsWrap');
  item.o.forEach((opt, idx)=>{
    const b = document.createElement('button');
    b.className = 'opt';
    b.textContent = opt;
    b.onclick = ()=> selectOption(idx, b);
    optsWrap.appendChild(b);
  });
  document.getElementById('nextBtn').onclick = ()=>{ qIndex++; renderQuestion(); };
}

function selectOption(idx, btnEl){
  if(answered) return;
  answered = true;
  const item = current.questions[qIndex];
  const allOpts = document.querySelectorAll('#optsWrap .opt');
  allOpts.forEach(o=>o.classList.add('disabled'));
  if(idx === item.a){
    btnEl.classList.add('correct');
    score++;
  } else {
    btnEl.classList.add('wrong');
    allOpts[item.a].classList.add('correct');
  }
  const fb = document.getElementById('factBox');
  fb.textContent = '💡 '+item.f;
  fb.classList.add('show');
  document.getElementById('nextBtn').classList.add('show');
  scoreTag.textContent = score+'/'+current.questions.length;
}

function renderResult(){
  const total = current.questions.length;
  progBar.style.width = '100%';
  let msg, big;
  const pct = score/total;
  if(pct === 1){ big='🏆'; msg='Zabardast! Sab sahi jawab!'; }
  else if(pct >= 0.7){ big='🎉'; msg='Bohat khoob! Achi knowledge hai.'; }
  else if(pct >= 0.4){ big='👍'; msg='Achi koshish! Thora aur seekho.'; }
  else { big='📚'; msg='Koi baat nahi, dobara try karo!'; }

  qbody.innerHTML = `
    <div class="resultWrap">
      <div class="big">${big}</div>
      <h2>Score: ${score} / ${total}</h2>
      <p>${msg}</p>
      <div class="resultBtns">
        <button class="retryBtn" id="retryBtn">🔁 Retry</button>
        <button class="homeBtn" id="homeBtn">🏠 Home</button>
      </div>
    </div>
  `;
  document.getElementById('retryBtn').onclick = ()=>{ qIndex=0; score=0; renderQuestion(); };
  document.getElementById('homeBtn').onclick = closeQuiz;
}
</script>
